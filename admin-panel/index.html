<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>پنل مدیریت | غزل کرمی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --must:#DFA02D;--must-d:#A87310;--must-l:#F3C766;--must-t:#FBEECB;
  --night:#0B1526;--night-2:#12203A;--night-3:#182A47;
  --bone:#FBF7EE;--bone-2:#F1E7CF;
  --line:#E3D5B2;--ink:#181207;--ink-2:#59481F;--danger:#C0392B;--success:#3A8A5A;
  --gline:rgba(223,160,45,.16);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Vazirmatn',sans-serif;background:var(--night);color:var(--bone);min-height:100vh;-webkit-font-smoothing:antialiased;}
a{color:inherit;}
.hidden{display:none !important;}
::selection{background:var(--must);color:var(--night);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--night);}
::-webkit-scrollbar-thumb{background:rgba(223,160,45,.35);border-radius:999px;border:2px solid var(--night);}
::-webkit-scrollbar-thumb:hover{background:var(--must);}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ---- login screen ---- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--night);padding:20px;
  background-image:radial-gradient(rgba(223,160,45,.08) 1px,transparent 1px);background-size:32px 32px;}
.login-card{background:var(--night-2);border:1px solid rgba(223,160,45,.25);border-radius:22px;padding:38px;width:100%;max-width:380px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:fadeInUp .5s cubic-bezier(.2,.8,.3,1);}
.login-card h1{color:#fff;font-size:21px;margin-bottom:6px;text-align:center;font-weight:900;}
.login-card p{color:rgba(251,247,238,.55);font-size:13px;text-align:center;margin-bottom:26px;}
.login-card input{width:100%;padding:14px 16px;border-radius:13px;border:1.5px solid rgba(223,160,45,.3);
  background:rgba(255,255,255,.04);color:#fff;font-family:inherit;font-size:15px;margin-bottom:12px;transition:border-color .2s ease,background .2s ease;}
.login-card input::placeholder{color:rgba(251,247,238,.35);}
.login-card input:focus{outline:none;border-color:var(--must);background:rgba(255,255,255,.06);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;
  border-radius:999px;font-weight:700;font-size:14px;border:1.5px solid transparent;cursor:pointer;
  font-family:inherit;transition:transform .2s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease,color .2s ease;}
.btn-gold{background:var(--must);color:var(--night);width:100%;}
.btn-gold:hover{background:var(--must-l);transform:translateY(-1px);box-shadow:0 10px 22px -10px rgba(223,160,45,.55);}
.btn-line{border-color:rgba(223,160,45,.45);color:var(--must-l);background:transparent;}
.btn-line:hover{border-color:var(--must);background:rgba(223,160,45,.08);}
.btn-danger{background:rgba(192,57,43,.14);color:#FF9A90;border-color:rgba(192,57,43,.3);}
.btn-danger:hover{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-ghost{background:rgba(255,255,255,.06);color:rgba(251,247,238,.75);}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff;}
.btn-sm{padding:9px 15px;font-size:12.5px;width:auto;}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none !important;box-shadow:none !important;}
.err-msg{color:#ff8a80;font-size:13px;text-align:center;margin-top:10px;min-height:16px;}

/* ---- app shell ---- */
#app{display:none;min-height:100vh;}
#app.on{display:flex;}
.sidebar{width:252px;flex-shrink:0;background:var(--night-2);color:#fff;min-height:100vh;padding:26px 0;overflow-y:auto;
  border-left:1px solid var(--gline);position:sticky;top:0;align-self:flex-start;height:100vh;}
.sidebar h2{padding:0 24px 18px;font-size:17px;color:var(--must-l);font-weight:900;border-bottom:1px solid var(--gline);margin-bottom:8px;
  display:flex;align-items:center;gap:9px;}
.sidebar h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--must);box-shadow:0 0 10px 1px rgba(223,160,45,.6);}
.sidebar .group-label{padding:18px 24px 8px;font-size:10.5px;color:rgba(251,247,238,.35);letter-spacing:.08em;}
.sidebar button{display:flex;align-items:center;gap:11px;width:100%;text-align:right;padding:12px 24px;
  background:none;border:none;color:rgba(251,247,238,.68);font-family:inherit;font-size:13.5px;cursor:pointer;
  border-right:3px solid transparent;transition:background .2s ease,color .2s ease,border-color .2s ease;}
.sidebar button:hover{background:rgba(223,160,45,.08);color:#fff;}
.sidebar button.on{background:rgba(223,160,45,.13);color:var(--must-l);border-right-color:var(--must);font-weight:700;}
.sidebar .logout{margin-top:20px;color:rgba(251,247,238,.4);}
.sidebar .logout:hover{background:rgba(192,57,43,.1);color:#ff8a80;}
/* padding-bottom is deliberately much bigger than the top/side padding —
   the last card on a short tab (e.g. a form with just a couple of fields)
   would otherwise end almost flush with the viewport edge, leaving no
   scroll room for anything that opens BELOW the last field (a date-picker
   popup, a select dropdown) to actually be reachable. The picker also
   flips upward on its own when there's truly no room (see
   attachJalaliPicker), but this is the simpler fix that covers everything
   else too — a dropdown, a toast, an accidentally-tall validation message. */
main{flex:1;padding:38px 42px 140px;max-width:1280px;}
main h1{font-size:23px;margin-bottom:26px;color:#fff;font-weight:900;letter-spacing:-.01em;}
main h3{font-size:15px;margin-bottom:14px;color:#fff;}
#mainContent{animation:fadeInUp .35s cubic-bezier(.2,.8,.3,1);}
.card{background:var(--night-2);border:1px solid var(--gline);border-radius:18px;padding:24px;margin-bottom:18px;
  transition:border-color .2s ease;}
.card:hover{border-color:rgba(223,160,45,.26);}
.section-title{font-size:12.5px;color:var(--must-l);font-weight:700;margin:30px 0 14px;letter-spacing:.04em;}
.section-title:first-child{margin-top:0;}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.row + .row{margin-top:14px;padding-top:14px;border-top:1px solid var(--gline);}
.muted{color:rgba(251,247,238,.55);font-size:13px;}
.tag{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;}
.tag-open{background:rgba(58,138,90,.18);color:#7FD9A4;}
.tag-closed{background:rgba(192,57,43,.18);color:#FF9A90;}
.tag-pending{background:rgba(223,160,45,.2);color:var(--must-l);}
.tag-muted{background:rgba(255,255,255,.07);color:rgba(251,247,238,.55);}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select{
  padding:10px 13px;border-radius:10px;border:1.5px solid var(--gline);
  font-family:inherit;font-size:13.5px;width:130px;background:rgba(255,255,255,.04);color:#fff;
  transition:border-color .2s ease,background .2s ease;}
input::placeholder{color:rgba(251,247,238,.35);}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,input[type=time]:focus,input[type=tel]:focus,select:focus{
  outline:none;border-color:var(--must);background:rgba(255,255,255,.06);}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.85);cursor:pointer;}
select option{background:var(--night-2);color:#fff;}
input[type=text].wide,input[type=tel].wide{width:240px;}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:rgba(251,247,238,.6);}
.form-grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.14);border-radius:999px;transition:.2s;}
.slider::before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
input:checked + .slider{background:var(--must);}
input:checked + .slider::before{transform:translateX(-20px);}
.grid-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.gimg{border:1.5px solid var(--gline);border-radius:13px;position:relative;background:rgba(255,255,255,.03);
  transition:border-color .2s ease,transform .2s ease;}
.gimg:hover{border-color:rgba(223,160,45,.35);transform:translateY(-2px);}
.gimg img{width:100%;height:140px;object-fit:cover;display:block;border-radius:13px 13px 0 0;}
/* یک ردیف باریک ۱۴۰px (کارت گالری) هرگز جای کافی برای select + چهار دکمه‌ی
   کنار هم نداره؛ اگه به‌جای اینکه بشکنه به خط بعد، از overflow:hidden کارت
   بیرون بزنه، همون‌جا نامرئی می‌شه — دقیقاً همین اتفاق برای دکمه‌ی «حذف»
   می‌افتاد: در DOM و قابل کلیک بود، ولی هیچ‌وقت روی صفحه دیده نمی‌شد. برای
   همین این‌جا overflow:hidden از کارت برداشته شده (فقط روی عکس با
   border-radius جداگانه اعمال می‌شه) و کل .meta ستونی شده تا هیچ کنترلی
   هیچ‌وقت بیرون از کارت کلیپ نشه. */
.gimg .meta{padding:9px;font-size:11.5px;display:flex;flex-direction:column;gap:8px;}
.gimg .meta-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.gimg select{font-family:inherit;font-size:11px;padding:5px;border-radius:6px;width:100%;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--night-2);color:#fff;
  border:1px solid rgba(223,160,45,.3);padding:13px 24px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;z-index:200;max-width:90vw;text-align:center;box-shadow:0 20px 40px -12px rgba(0,0,0,.5);}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-8px);}
.loading{color:rgba(251,247,238,.5);font-size:13.5px;padding:20px 0;}
textarea{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--gline);font-family:inherit;font-size:13.5px;
  resize:vertical;background:rgba(255,255,255,.04);color:#fff;transition:border-color .2s ease;}
textarea:focus{outline:none;border-color:var(--must);}
.upload-btn{display:inline-block;padding:10px 18px;border-radius:999px;border:1.5px dashed rgba(223,160,45,.5);
  color:var(--must-l);font-size:13px;cursor:pointer;transition:background .2s ease,border-color .2s ease;}
.upload-btn:hover{background:rgba(223,160,45,.08);border-color:var(--must);}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.chip{padding:8px 15px;border-radius:999px;border:1.5px solid var(--gline);background:rgba(255,255,255,.03);color:rgba(251,247,238,.6);
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;}
.chip.on{background:var(--must);color:var(--night);border-color:var(--must);}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.mobile-scroll-hint{display:none;}
table.simple{width:100%;border-collapse:collapse;font-size:13px;min-width:480px;}
table.simple th{text-align:right;color:rgba(251,247,238,.5);font-weight:700;font-size:12px;padding:9px 6px;border-bottom:1.5px solid var(--gline);}
table.simple td{padding:9px 6px;border-bottom:1px solid var(--gline);}
.slot-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1.5px solid var(--gline);font-size:12px;margin:3px;
  background:rgba(255,255,255,.03);}
.slot-pill.off{opacity:.4;text-decoration:line-through;}
.slot-pill button{background:none;border:none;cursor:pointer;color:#FF9A90;font-size:13px;padding:0;line-height:1;}

/* ---- visual hierarchy: primary (frequent) vs advanced (technical/rare) ---- */
.card.primary{border-color:rgba(223,160,45,.4);box-shadow:0 0 0 1px rgba(223,160,45,.1) inset;}
.section-title{display:flex;align-items:center;gap:10px;}
.section-title::after{content:"";flex:1;height:1px;background:var(--gline);}

.day-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding:14px 4px;border-radius:12px;transition:background .2s ease;}
.day-row:hover{background:rgba(255,255,255,.025);}
.day-row + .day-row{border-top:1px solid var(--gline);}
.day-row .day-main{display:flex;align-items:center;gap:14px;}
.day-row .name{min-width:78px;font-size:15.5px;font-weight:900;color:#fff;}
.day-row .day-hours{display:flex;gap:12px;flex-wrap:wrap;}
.switch.lg{width:52px;height:30px;}
.switch.lg .slider::before{height:24px;width:24px;}
.switch.lg input:checked + .slider::before{transform:translateX(-22px);}

.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;}
.slot-cell{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 8px;border-radius:13px;
  border:1.5px solid var(--gline);background:rgba(255,255,255,.03);transition:border-color .2s ease,opacity .2s ease;}
.slot-cell:hover{border-color:rgba(223,160,45,.35);}
.slot-cell.off{opacity:.4;}
.slot-cell .t{font-size:14.5px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;}
.slot-owner{font-family:inherit;font-size:10.5px;padding:3px 4px;border-radius:6px;width:100%;
  background:rgba(255,255,255,.04);border:1px solid var(--gline);color:rgba(251,247,238,.75);}
.slot-cell .actions{display:flex;gap:4px;}
.slot-cell .actions button{background:none;border:none;cursor:pointer;font-size:13px;padding:3px 6px;color:rgba(251,247,238,.6);border-radius:6px;transition:.15s;}
.slot-cell .actions button:hover{color:var(--must-l);background:rgba(223,160,45,.1);}
.slot-cell .actions button.del:hover{color:#FF9A90;background:rgba(192,57,43,.12);}

details.adv{border:1.5px dashed var(--gline);border-radius:14px;margin-top:20px;overflow:hidden;}
details.adv summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:700;color:rgba(251,247,238,.72);user-select:none;}
details.adv summary::-webkit-details-marker{display:none;}
details.adv summary::before{content:"⌄";display:inline-block;transition:transform .2s ease;color:var(--must-l);font-size:16px;line-height:1;}
details.adv[open] summary::before{transform:rotate(-180deg);}
details.adv summary:hover{color:#fff;}
details.adv .adv-body{padding:2px 18px 22px;border-top:1px solid var(--gline);}
details.adv .adv-body .section-title:first-child{margin-top:20px;}

/* same collapsible mechanics as .adv, but a solid gold-tinted border and a
   "+" summary icon — this signals "an action you can take, tucked away to
   save space" rather than .adv's dashed "rarely-touched technical setting" */
details.add-form{border:1.5px solid var(--gline);border-radius:14px;margin-bottom:22px;overflow:hidden;background:rgba(255,255,255,.015);}
details.add-form summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;gap:11px;
  font-size:14px;font-weight:700;color:var(--must-l);user-select:none;}
details.add-form summary::-webkit-details-marker{display:none;}
details.add-form summary::before{content:"+";display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  width:22px;height:22px;border-radius:50%;background:rgba(223,160,45,.15);color:var(--must-l);font-size:15px;line-height:1;transition:transform .2s ease;}
details.add-form[open] summary::before{transform:rotate(45deg);}
details.add-form summary:hover{color:#fff;}

/* ---- dashboard ---- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px;}
.stat-tile{background:var(--night-2);border:1px solid var(--gline);border-radius:16px;padding:20px;
  transition:border-color .2s ease,transform .2s ease;}
.stat-tile:hover{border-color:rgba(223,160,45,.32);transform:translateY(-2px);}
.stat-tile.hero{border-color:rgba(223,160,45,.45);box-shadow:0 0 0 1px rgba(223,160,45,.1) inset;}
.stat-tile.hero .n{font-size:36px;}
.stat-tile .n{font-size:28px;font-weight:900;color:var(--must-l);display:block;line-height:1.25;}
.stat-tile .l{font-size:12px;color:rgba(251,247,238,.55);margin-top:5px;}
.stat-tile .rev{font-size:12.5px;color:rgba(251,247,238,.7);margin-top:8px;padding-top:8px;border-top:1px solid var(--gline);}
.stat-tile .rev b{color:#7FD9A4;font-weight:700;}
.chart-wrap{display:flex;align-items:flex-end;gap:8px;height:150px;padding:6px 4px 0;}
.chart-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
.chart-bar{width:100%;max-width:36px;background:linear-gradient(180deg,var(--must-l),var(--must-d));
  border-radius:8px 8px 3px 3px;transition:height .6s cubic-bezier(.2,.8,.3,1);min-height:4px;}
.chart-bar-col .lbl{font-size:11px;color:rgba(251,247,238,.5);}
.chart-bar-col .cnt{font-size:12px;color:var(--must-l);font-weight:700;}
.popular-list{display:flex;flex-direction:column;gap:12px;}
.popular-row{display:flex;align-items:center;gap:12px;}
.popular-row .bar-bg{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;}
.popular-row .bar-fill{height:100%;background:linear-gradient(90deg,var(--must-d),var(--must-l));border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.3,1);}
.popular-row .name{width:140px;flex-shrink:0;font-size:13px;color:#fff;}
.popular-row .count{width:26px;flex-shrink:0;text-align:left;font-size:12.5px;color:var(--must-l);font-weight:700;}

/* ---- calendar (تقویم) ---- */
.cal-toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.cal-toolbar select{width:auto;min-width:170px;}
.cal-nav{display:flex;align-items:center;gap:6px;}
.cal-nav .btn{padding:8px 14px;}
.cal-jump-label{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(251,247,238,.75);}
.cal-range-label{font-size:13px;color:rgba(251,247,238,.65);margin-right:auto;}

.cal-legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px;padding:12px 16px;
  background:rgba(255,255,255,.02);border:1px solid var(--gline);border-radius:12px;}
.cal-leg-item{display:flex;align-items:center;gap:7px;font-size:12px;color:rgba(251,247,238,.65);}
.cal-sw{width:14px;height:14px;border-radius:5px;display:inline-block;flex-shrink:0;border:1.5px solid var(--gline);}
.cal-sw-empty{background:rgba(251,247,238,.24);border-color:rgba(251,247,238,.4);}
.cal-sw-booked{background:rgba(223,160,45,.34);border-color:var(--must);}
.cal-sw-closed{background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 5px,rgba(255,255,255,.14) 5px 10px);}
.cal-sw-past{background:rgba(255,255,255,.035);opacity:.5;}

/* desktop: week table, time rows × Sat..Fri columns */
.cal-week-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--gline);border-radius:16px;background:var(--night-2);}
table.cal-grid{width:100%;border-collapse:collapse;min-width:760px;}
table.cal-grid th,table.cal-grid td{border:1px solid var(--gline);}
.cal-timecol{width:64px;min-width:64px;text-align:center;font-size:12px;color:rgba(251,247,238,.5);
  font-variant-numeric:tabular-nums;padding:10px 4px;background:rgba(255,255,255,.015);}
.cal-daycol{padding:0;background:rgba(255,255,255,.02);}
.cal-daycol.is-today{background:rgba(223,160,45,.09);}
.cal-daycol-inner{padding:12px 8px;text-align:center;position:relative;}
.cal-dname{font-size:12.5px;font-weight:800;color:#fff;}
.cal-ddate{font-size:11px;color:rgba(251,247,238,.55);margin-top:2px;}
.cal-daytag{margin-top:6px;}
.cal-kebab{position:absolute;top:6px;left:6px;background:none;border:none;color:rgba(251,247,238,.45);
  font-size:16px;cursor:pointer;padding:2px 7px;border-radius:8px;line-height:1;}
.cal-kebab:hover{color:var(--must-l);background:rgba(223,160,45,.1);}

.cal-cell{height:50px;text-align:center;vertical-align:middle;cursor:pointer;transition:background .15s ease;padding:4px 6px;font-size:11.5px;}
.cal-cell.cal-blank{cursor:default;background:transparent;}
.cal-cell.cal-empty{background:rgba(251,247,238,.24);}
.cal-cell.cal-empty:hover{background:rgba(223,160,45,.4);}
.cal-cell.cal-booked{background:rgba(223,160,45,.34);}
.cal-cell.cal-booked:hover{background:rgba(223,160,45,.46);}
.cal-cell.cal-closed{background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 7px,rgba(255,255,255,.09) 7px 14px);cursor:default;}
.cal-cell.cal-past{background:rgba(255,255,255,.035);opacity:.5;cursor:default;}
.cal-cell-title{font-weight:800;color:#fff;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;margin:0 auto;}
.cal-cell-sub{font-size:10.5px;color:rgba(251,247,238,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;margin:2px auto 0;}

/* mobile: horizontal 7-day switcher strip */
.cal-mobile-strip{display:none;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:6px;-webkit-overflow-scrolling:touch;}
.cal-strip-day{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px;padding:10px 6px;
  border-radius:13px;border:1.5px solid var(--gline);background:rgba(255,255,255,.03);color:rgba(251,247,238,.7);
  font-family:inherit;cursor:pointer;transition:.2s;}
.cal-strip-day.on{background:var(--must);color:var(--night);border-color:var(--must);}
.cal-strip-day.is-today:not(.on){border-color:var(--must);color:var(--must-l);}

/* mobile: single-day vertical list */
.cal-day-list{display:flex;flex-direction:column;gap:9px;}
.cal-row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:13px;border:1.5px solid var(--gline);
  background:rgba(255,255,255,.03);cursor:pointer;transition:.15s;min-height:48px;}
.cal-row-time{font-size:14.5px;font-weight:800;color:#fff;min-width:52px;font-variant-numeric:tabular-nums;}

.cal-summary-n{font-size:22px;font-weight:900;color:var(--must-l);display:block;}

/* modal: booking details, quick-add menu, close-a-range form — shared by
   both breakpoints instead of a separate anchored popover, since a centered
   overlay is far more reliable across touch/mouse and avoids off-screen
   positioning bugs near grid edges */
.cal-modal-overlay{position:fixed;inset:0;background:rgba(4,8,16,.72);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:300;animation:fadeInUp .2s ease;}
.cal-modal-card{background:var(--night-2);border:1px solid rgba(223,160,45,.3);border-radius:18px;padding:22px;
  width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);}
.cal-modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;font-size:15px;color:#fff;}
.cal-modal-close{background:none;border:none;color:rgba(251,247,238,.5);font-size:16px;cursor:pointer;padding:4px 8px;border-radius:8px;flex-shrink:0;}
.cal-modal-close:hover{color:#fff;background:rgba(255,255,255,.08);}

/* ---- Jalali date picker (wraps a hidden native <input type="date">, since
   the native picker is always Gregorian and can't be switched via CSS) ---- */
.jdp-wrap{position:relative;display:inline-block;}
.jdp-trigger{padding:10px 13px;border-radius:10px;border:1.5px solid var(--gline);font-family:inherit;font-size:13.5px;
  width:130px;background:rgba(255,255,255,.04);color:#fff;text-align:right;cursor:pointer;transition:border-color .2s ease,background .2s ease;}
.jdp-trigger:hover{border-color:rgba(223,160,45,.4);}
/* position:fixed + appended straight to <body> (see attachJalaliPicker) —
   NOT a child of .jdp-wrap. A date field inside any container with
   overflow:hidden (e.g. the collapsible details.add-form used by several
   tabs, including نظرات's "افزودن دستی نظر") used to clip this popup no
   matter how its own top/left were computed, since position:absolute is
   clipped by *any* overflow:hidden ancestor, not just its containing
   block. Rendering at the body level sidesteps every such ancestor at
   once, current or future. top/left are set entirely in JS
   (positionPopup) — there's no meaningful static position left for CSS
   to express once the popup no longer sits next to its trigger in the DOM. */
.jdp-popup{position:fixed;z-index:9999;background:var(--night-2);
  border:1px solid rgba(223,160,45,.3);border-radius:14px;padding:14px;width:240px;box-shadow:0 20px 45px -15px rgba(0,0,0,.6);}
.jdp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13.5px;font-weight:700;color:#fff;}
.jdp-nav{background:none;border:none;color:var(--must-l);font-size:16px;cursor:pointer;padding:2px 9px;border-radius:8px;line-height:1;}
.jdp-nav:hover{background:rgba(223,160,45,.12);}
.jdp-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10.5px;color:rgba(251,247,238,.45);margin-bottom:4px;}
.jdp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.jdp-day{background:none;border:none;color:#fff;font-size:12.5px;padding:7px 0;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums;}
.jdp-day:hover{background:rgba(223,160,45,.15);}
.jdp-day.sel{background:var(--must);color:var(--night);font-weight:700;}

@media(max-width:760px){
  #app.on{flex-direction:column;}
  .sidebar{width:100%;display:flex;overflow-x:auto;padding:12px 0;min-height:auto;height:auto;position:sticky;top:0;z-index:50;}
  .sidebar h2,.sidebar .logout,.sidebar .group-label{display:none;}
  .sidebar button{white-space:nowrap;border-right:none;border-bottom:3px solid transparent;padding:12px 16px;}
  .sidebar button.on{border-bottom-color:var(--must);}
  main{padding:20px 16px 120px;}
  .mobile-scroll-hint{display:block;font-size:11.5px;color:rgba(251,247,238,.45);margin-bottom:10px;}
  main h1{font-size:19px;margin-bottom:20px;}
  .card{padding:18px;border-radius:14px;}
  .form-grid{gap:12px;}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select{width:100%;}
  input[type=text].wide,input[type=tel].wide{width:100%;}
  .jdp-wrap{width:100%;}
  .jdp-trigger{width:100%;}
  /* width no longer comes from "100% of .jdp-wrap" — .jdp-popup isn't
     inside .jdp-wrap anymore, so that would mean 100% of the viewport.
     positionPopup() sets an explicit pixel width matching the trigger
     instead (see attachJalaliPicker). */
  .stat-tile .n{font-size:24px;}
  .popular-row .name{width:100px;font-size:12.5px;}
  .day-row{padding:12px 2px;}
  .day-row .name{min-width:64px;font-size:14px;}
  .slot-grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));}

  .cal-toolbar{flex-direction:column;align-items:stretch;}
  .cal-toolbar select{width:100%;}
  .cal-nav{justify-content:space-between;}
  .cal-jump-label{justify-content:space-between;}
  .cal-jump-label .jdp-wrap{flex:1;}
  .cal-jump-label .jdp-trigger{width:100%;}
  .cal-mobile-strip{display:flex;}
  .cal-legend{gap:12px 18px;padding:10px 14px;}
  .cal-day-header .row{flex-direction:column;align-items:stretch;gap:14px;}
  .cal-day-header .row > div:last-child{display:flex;gap:8px;flex-wrap:wrap;}
  .cal-day-header .row > div:last-child .btn{flex:1;min-width:140px;}
}
</style>

<body>

<div id="app">
  <nav class="sidebar">
    <h2>غزل کرمی</h2>

    <button data-tab="refunds">بازگشت وجه در انتظار<span id="refundBadge" style="display:none;background:#c0392b;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-right:6px;"></span></button>
    <div class="group-label">محتوای سایت</div>

    <button data-tab="classes">درخواست کلاس</button>
    <div class="group-label">تنظیمات</div>
    <button data-tab="contact">اطلاعات تماس</button>
    <button data-tab="smsLogs">پیامک‌ها</button>

  </nav>
  <main id="mainContent"></main>

<div class="toast" id="toast"></div>

<script>
const API = "/api";
let TOKEN = localStorage.getItem("gk_admin_token") || "";

function toast(msg, isErr){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.background=isErr?"var(--danger)":"var(--night)";
  t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),2800);
}
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function toman(n){ return Number(n||0).toLocaleString("fa-IR")+" تومان"; }

const jalaliMonths=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function pd(n){ return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }
/* تبدیل میلادی به جلالی (شمسی) — همون الگوریتم استاندارد که تو public/index.html
   برای تاریخ نظرات و نوبت‌های مشتری استفاده و تست شده */
function toJalali(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=(gy<=1600)?0:979;
  gy-=(gy<=1600)?621:1600;
  const gy2=(gm>2)?(gy+1):gy;
  let days=(365*gy)+(Math.floor((gy2+3)/4))-(Math.floor((gy2+99)/100))+(Math.floor((gy2+399)/400))-80+gd+g_d_m[gm-1];
  jy+=33*(Math.floor(days/12053));days%=12053;
  jy+=4*(Math.floor(days/1461));days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}
  const jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
/* تنها تابع مشترک برای نمایش تاریخ به ادمین — هرجای پنل که تاریخ نشون داده
   می‌شه باید از همین رد بشه، نه slice(0,10) خام میلادی یا toLocaleDateString
   عددی؛ ورودی هم رشته‌ی ISO و هم شیء Date رو قبول می‌کنه */
function fmtJalaliDate(dateInput){
  const d=new Date(dateInput);
  const [jy,jm,jd]=toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
  return `${pd(jd)} ${jalaliMonths[jm-1]} ${pd(jy)}`;
}
/* تبدیل جلالی به میلادی — همون الگوریتم معکوسی که تو public/index.html
   برای تقویم رزرو مشتری استفاده و تست شده؛ فقط جای دیگه‌ای که یک روزِ
   انتخاب‌شده‌ی شمسی باید به رشته‌ی ISO برای بک‌اند تبدیل بشه لازمه */
function jalaliToGregorian(jy,jm,jd){
  jy+=1595;
  let days=-355668+(365*jy)+(Math.floor(jy/33)*8)+Math.floor(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  let gy=400*Math.floor(days/146097);
  days%=146097;
  if(days>36524){
    gy+=100*Math.floor(--days/36524);
    days%=36524;
    if(days>=365)days++;
  }
  gy+=4*Math.floor(days/1461);
  days%=1461;
  if(days>365){
    gy+=Math.floor((days-1)/365);
    days=(days-1)%365;
  }
  let gd=days+1;
  const sal_a=[0,31,((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm;
  for(gm=1;gm<=12;gm++){
    if(gd<=sal_a[gm])break;
    gd-=sal_a[gm];
  }
  return [gy,gm,gd];
}
function jdpDaysInMonth(jy,jm){
  if(jm<=6) return 31;
  if(jm<=11) return 30;
  /* اسفند: طول واقعی‌اش از فاصله‌ی دقیق میان دو نوروز پشت‌سرهم */
  const [gy1,gm1,gd1]=jalaliToGregorian(jy,1,1);
  const [gy2,gm2,gd2]=jalaliToGregorian(jy+1,1,1);
  const totalDays=Math.round((new Date(gy2,gm2-1,gd2)-new Date(gy1,gm1-1,gd1))/86400000);
  return totalDays-336; /* ۶×۳۱ + ۵×۳۰ روزِ ۱۱ ماه اول، باقی‌مانده طول اسفند است */
}

// popup زیر فیلد است و به جای body چسبیده (نه داخل .jdp-wrap — به همین
// دلیل هیچ ancestor ای با overflow:hidden، از جمله details.add-form که چند
// تب ازش استفاده می‌کنن، دیگه نمی‌تونه ببرتش)؛ پس موقعیت اولیه‌اش کاملاً
// دستیه: زیر دکمه‌ی trigger، چسبیده به لبه‌ی راستش (هم‌سو با چیدمان RTL).
// بعد از آن، سرریز هر چهار جهت صفحه اندازه‌گیری و جابه‌جا می‌شود — اگر پایین
// صفحه جا نبود، به‌جای پایینِ فیلد، بالای فیلد باز می‌شه.
function positionPopup(popup, trigger){
  const margin=8;
  const isMobile=window.innerWidth<=760;
  if(isMobile) popup.style.width=`${trigger.getBoundingClientRect().width}px`;

  const t=trigger.getBoundingClientRect();
  popup.style.top=`${t.bottom+margin}px`;
  popup.style.left=`${t.right-popup.offsetWidth}px`;

  let rect=popup.getBoundingClientRect();
  if(rect.bottom>window.innerHeight-margin && t.top-margin>rect.height){
    popup.style.top=`${t.top-margin-popup.offsetHeight}px`;
    rect=popup.getBoundingClientRect();
  }

  let dx=0, dy=0;
  if(rect.left<margin) dx=margin-rect.left;
  else if(rect.right>window.innerWidth-margin) dx=(window.innerWidth-margin)-rect.right;
  if(rect.top<margin) dy=margin-rect.top;
  else if(rect.bottom>window.innerHeight-margin) dy=(window.innerHeight-margin)-rect.bottom;
  if(dx) popup.style.left=`${parseFloat(popup.style.left)+dx}px`;
  if(dy) popup.style.top=`${parseFloat(popup.style.top)+dy}px`;
}

/* تقویم انتخاب تاریخِ شمسی — یک <input type="date"> موجود را می‌گیرد (مخفی‌اش
   می‌کند، ولی به‌عنوان تک‌منبع مقدار در DOM نگه می‌داره) و به‌جاش یک دکمه با
   برچسب شمسی + یک تقویم بازشوی شمسی نشون می‌ده. چون input واقعی و مقدار و
   رویداد change‌اش دست‌نخورده می‌مونه، هیچ‌کدوم از handler های onchange یا
   خواندن مستقیمِ .value که از قبل روی این فیلدها نوشته شده لازم نیست عوض بشه —
   فقط روش انتخاب مقدار عوض می‌شه، نه خودِ مقدار یا جریان داده. */
function attachJalaliPicker(inputId){
  const real=document.getElementById(inputId);
  if(!real || real.dataset.jalaliAttached) return;
  real.dataset.jalaliAttached="1";
  real.style.display="none";

  const wrap=document.createElement("div");
  wrap.className="jdp-wrap";
  real.insertAdjacentElement("afterend", wrap);
  const trigger=document.createElement("button");
  trigger.type="button";
  trigger.className="jdp-trigger";
  wrap.appendChild(trigger);

  function label(){
    if(!real.value) return "انتخاب تاریخ";
    const [y,m,d]=real.value.split("-").map(Number);
    const [jy,jm,jd]=toJalali(y,m,d);
    return `${pd(jd)} ${jalaliMonths[jm-1]} ${pd(jy)}`;
  }
  trigger.textContent=label();

  let viewJY, viewJM;
  // مهم: دکمه‌های ناوبری (‹›) فقط یک‌بار ساخته می‌شن و در DOM ثابت می‌مونن —
  // اگه به‌جاش هر بار کل popup.innerHTML عوض بشه، همون دکمه‌ای که همین الان
  // کلیک شده وسط پردازش رویداد کلیک خودش از DOM جدا می‌شه؛ آن‌گاه
  // e.target.closest('.jdp-wrap') برای اون رویداد دیگه چیزی پیدا نمی‌کنه و
  // listener سراسریِ «کلیک بیرون» popup رو می‌بنده — یعنی یک کلیک روی خودِ
  // ناوبری، popup رو باز می‌کرد و بلافاصله همون لحظه دوباره می‌بست. برای
  // همین، فقط برچسبِ ماه/سال و شبکه‌ی روزها re-render می‌شن، نه کل popup.
  function renderGrid(monthLabelEl, gridEl){
    monthLabelEl.textContent=`${jalaliMonths[viewJM-1]} ${pd(viewJY)}`;
    const daysInMonth=jdpDaysInMonth(viewJY,viewJM);
    const [gy1,gm1,gd1]=jalaliToGregorian(viewJY,viewJM,1);
    const firstDow=(new Date(gy1,gm1-1,gd1).getDay()+1)%7; /* شنبه=۰ */
    let html="";
    for(let i=0;i<firstDow;i++) html+=`<span></span>`;
    for(let day=1;day<=daysInMonth;day++){
      const [gy,gm,gd]=jalaliToGregorian(viewJY,viewJM,day);
      const iso=`${gy}-${String(gm).padStart(2,"0")}-${String(gd).padStart(2,"0")}`;
      html+=`<button type="button" class="jdp-day ${real.value===iso?"sel":""}" data-iso="${iso}">${pd(day)}</button>`;
    }
    gridEl.innerHTML=html;
    gridEl.querySelectorAll(".jdp-day").forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      real.value=b.dataset.iso;
      real.dispatchEvent(new Event("change",{bubbles:true}));
      trigger.textContent=label();
      popupEl?.remove();
      popupEl=null;
    });
  }

  // popup به body وصل می‌شه (نه wrap)، پس دیگه با یک DOM query نسبت به wrap
  // قابل پیدا کردن نیست — رفرنسش رو همین‌جا نگه می‌داریم
  let popupEl=null;
  trigger.onclick=(e)=>{
    e.stopPropagation();
    // popupEl.isConnected is false if something else (outside click, scroll)
    // already removed it from the DOM — that must be treated as "already
    // closed", not "still open", or the trigger would need two clicks to
    // reopen it
    if(popupEl && popupEl.isConnected){ popupEl.remove(); popupEl=null; return; }
    popupEl=null;
    document.querySelectorAll(".jdp-popup").forEach(p=>p.remove());
    const now=new Date();
    if(real.value){
      const [y,m,d]=real.value.split("-").map(Number);
      [viewJY,viewJM]=toJalali(y,m,d);
    }else{
      [viewJY,viewJM]=toJalali(now.getFullYear(),now.getMonth()+1,now.getDate());
    }
    const popup=document.createElement("div");
    popup.className="jdp-popup";
    popup.innerHTML=`<div class="jdp-head">
      <button type="button" class="jdp-nav" data-dir="1">›</button>
      <span></span>
      <button type="button" class="jdp-nav" data-dir="-1">‹</button>
    </div>
    <div class="jdp-dow">${["ش","ی","د","س","چ","پ","ج"].map(s=>`<span>${s}</span>`).join("")}</div>
    <div class="jdp-grid"></div>`;
    document.body.appendChild(popup);
    popupEl=popup;
    const monthLabelEl=popup.querySelector(".jdp-head span");
    const gridEl=popup.querySelector(".jdp-grid");
    popup.querySelectorAll(".jdp-nav").forEach(b=>b.onclick=(e2)=>{
      e2.stopPropagation();
      viewJM+=Number(b.dataset.dir);
      if(viewJM>12){viewJM=1;viewJY++;}
      if(viewJM<1){viewJM=12;viewJY--;}
      renderGrid(monthLabelEl, gridEl);
      positionPopup(popup, trigger);
    });
    renderGrid(monthLabelEl, gridEl);
    positionPopup(popup, trigger);
  };
  // اگه جای دیگه‌ای مقدار input واقعی رو مستقیم عوض کنه (کمتر پیش میاد، ولی
  // برای اطمینان)، برچسبِ دکمه هم به‌روز بمونه
  real.addEventListener("change",()=>{ trigger.textContent=label(); });
}
// یک listener سراسری برای بستن هر تقویم بازی که بیرونش کلیک بشه — یک‌بار
// ثبت می‌شه (نه یک‌بار به‌ازای هر attachJalaliPicker)، چون هر بار باز شدن یک
// تب، تمام input های تاریخ رو از نو می‌سازه و attachJalaliPicker رو دوباره
// صدا می‌زنه؛ یک listener جدا به‌ازای هر بار، طی یک نشست طولانی روی هم تلنبار
// می‌شد
document.addEventListener("click",(e)=>{
  // یک target که دیگه به سند وصل نیست (مثلاً همون لحظه با یک re-render حذف
  // شده) closest() روی هیچی رو برنمی‌گردونه — نباید این حالت به معنیِ
  // «کلیک بیرون از تقویم» تعبیر بشه
  if(!e.target.isConnected) return;
  // popup دیگه فرزند wrap نیست (به body وصله)، پس کلیک روی خودِ popup باید
  // جدا از کلیک روی trigger چک بشه، وگرنه کلیک روی فضای خالیِ popup (نه
  // دقیقاً یک دکمه) به‌اشتباه «کلیک بیرون» حساب می‌شه و همون لحظه می‌بندتش
  if(e.target.closest(".jdp-wrap") || e.target.closest(".jdp-popup")) return;
  document.querySelectorAll(".jdp-popup").forEach(p=>p.remove());
});
// اسکرول هر ظرفِ داخل صفحه (نه فقط کل صفحه) رو هم می‌گیره چون روی document
// با capture:true ثبت شده — popup با position:fixed دیگه با trigger‌اش
// اسکرول نمی‌شه، پس به‌جای اینکه جا بمونه، بسته می‌شه
document.addEventListener("scroll",()=>{
  document.querySelectorAll(".jdp-popup").forEach(p=>p.remove());
},true);

/* every tab render goes through this instead of a raw innerHTML assignment,
   so switching tabs gets a consistent subtle fade instead of an abrupt swap */
function setMainContent(html){
  const el=document.getElementById("mainContent");
  el.innerHTML=html;
  el.style.animation='none';
  void el.offsetWidth; /* force reflow so the animation restarts every time */
  el.style.animation='fadeInUp .35s cubic-bezier(.2,.8,.3,1)';
  // متن‌های چندخطیِ ذخیره‌شده (بیوگرافی، توضیح سرویس، متن نظر و ...) اغلب
  // بلندتر از دو خط پیش‌فرض textarea هستن — بدون این، متن موجود همون لحظه‌ی
  // باز شدن تب، وسط یک خط بریده می‌شه و کاربر فکر می‌کنه محتوا خراب/ناقصه؛
  // این باکس رو همون لحظه‌ی رندر به اندازه‌ی متنِ داخلش می‌کِشه
  el.querySelectorAll("textarea[data-autogrow]").forEach(autoGrowTextarea);
}
function autoGrowTextarea(el){
  el.style.height="auto";
  el.style.height=(el.scrollHeight+2)+"px";
}
// یک listener سراسری (نه یک‌بار به‌ازای هر تب) برای رشد زنده‌ی textarea حین
// تایپ کاربر، هم‌راستا با الگوی listener سراسریِ بستن تقویم بازشو در پایین فایل
document.addEventListener("input",(e)=>{
  if(e.target.matches && e.target.matches("textarea[data-autogrow]")) autoGrowTextarea(e.target);
});

/* prevents a create-type button from firing a second overlapping request if
   double-clicked (or clicked again before the toast/re-render from the first
   click lands) — some of these actions (manual reviews, social links) have
   no database uniqueness constraint backing them, so a double-submit there
   would genuinely create a duplicate row, not just show a confusing error */
function withSubmitGuard(fn){
  return async function(...args){
    const btn = typeof event!=="undefined" && event && event.target ? event.target.closest("button") : null;
    if(btn){ if(btn.dataset.busy==="1") return; btn.dataset.busy="1"; btn.disabled=true; }
    try{ await fn.apply(this,args); }
    finally{ if(btn){ btn.dataset.busy=""; btn.disabled=false; } }
  };
}

async function api(path, opts={}){
  const isForm = opts.body instanceof FormData;
  const res = await fetch(API+path, {
    ...opts,
    headers:{
      ...(isForm?{}:{"Content-Type":"application/json"}),
      ...(TOKEN?{Authorization:`Bearer ${TOKEN}`}:{}),
      ...(opts.headers||{}),
    },
  });
  if(res.status===401){ logout(); throw new Error("نشست منقضی شده."); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||"خطایی رخ داد.");
  return data;
}

async function doLogin(){
  const phone=document.getElementById("loginPhone").value.trim();
  const password=document.getElementById("loginPass").value;
  const errEl=document.getElementById("loginErr");
  errEl.textContent="";
  try{
    const res=await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone,password})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||"ورود ناموفق بود.");
    if(data.user.role!=="ADMIN") throw new Error("این حساب دسترسی مدیریت ندارد.");
    TOKEN=data.token;
    localStorage.setItem("gk_admin_token",TOKEN);
    boot();
  }catch(e){ errEl.textContent=e.message; }
}

}

/* =====================================================================
   تقویم: نمای هفتگی (دسکتاپ) / روزانه (موبایل) که کارهای روزمره‌ی رزرو —
   دیدن خالی/پر، ثبت نوبت دستی، بستن یک ساعت یا یک بازه، تعطیل کردن یک روز —
   را مستقیم از خود تقویم انجام می‌دهد، بدون رفتن به تب‌های دیگر. همه‌ی
   نوشتن‌ها از همون endpoint هایی که تب‌های «زمان‌بندی سالن» و «رزروها» از
   قبل دارن رد می‌شن (رزرو دستی، استثنای روز)، چیز جدیدی از پایه نساخته شده.

   تاریخ داخلی همیشه یک Date با نیمه‌شب UTC است (همون قرارداد پارس‌شده‌ی
   backend/lib/dates.ts)، نه زمان محلی مرورگر — چون هفته‌ی ایرانی باید از
   شنبه شروع بشه و «امروز» باید بر اساس ساعت تهران باشه، نه ساعت سرور یا
   دستگاه ادمین.
   ===================================================================== */
const CAL_TEHRAN_OFFSET_MIN = 3 * 60 + 30;
function calNowInTehran(){ return new Date(Date.now() + CAL_TEHRAN_OFFSET_MIN * 60000); }
function calTodayUTC(){ const t = calNowInTehran(); return new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate())); }
function calDateStr(d){ return d.toISOString().slice(0, 10); }
function calAddDays(d, n){ const r = new Date(d); r.setUTCDate(r.getUTCDate() + n); return r; }
function calDayOfWeek(d){ return d.getUTCDay(); } // 0=یکشنبه..6=شنبه، مطابق backend
// شنبه‌ی هفته‌ای که این تاریخ توش قرار داره — همون فرمول «daysSinceSaturday»ی
// که GET /admin/dashboard سمت سرور برای هفته‌ی جاری استفاده می‌کنه
function calWeekStartFor(d){ const dow = calDayOfWeek(d); return calAddDays(d, -((dow + 1) % 7)); }
// فقط برای گرفتن روز جلالی (jd) با همون منطق toJalali/fmtJalaliDate بالای
// همین فایل — کامپوننت‌های محلیِ Date را می‌خونه، نه UTC، دقیقاً هم‌راستا با
// fmtJalaliDate تا هیچ‌جا عدد متفاوتی از همون تاریخ نشون داده نشه
function calJalaliDay(d){ const [, , jd] = toJalali(d.getFullYear(), d.getMonth() + 1, d.getDate()); return pd(jd); }

const CAL_NOT_OCCUPYING = ["CANCELLED", "EXPIRED"]; // این دو وضعیت یعنی SlotHold پاک شده و اون تایم واقعاً خالیه

// انتخاب مستقیم یک تاریخ از تقویم شمسی — برای پرش سریع به چند هفته/ماه جلوتر
// یا عقب‌تر، به‌جای کلیک‌های پی‌درپی روی دکمه‌ی «قبلی/بعدی» که فقط هفته‌به‌هفته
// جلو می‌رن
window.calJumpToDate = (dateStr) => {
  if (!dateStr) return;
  const [y, m, d] = dateStr.split("-").map(Number);
  const date = new Date(Date.UTC(y, m - 1, d));
  calWeekStart = calWeekStartFor(date);
  calSelectedDate = date;
  calLoadAndRender();
};

  calCategoryId = id;

window.calGoToday = () => {

  calWeekStart = calWeekStartFor(t);

// دسکتاپ (نمای هفتگی): قبلی/بعدی یعنی یک هفته. موبایل (نمای روزانه): یعنی
// یک روز — و اگر از هفته‌ی جاری بیرون رفت، پنجره‌ی هفته هم دنبالش می‌آد
window.calNav = (dir) => {
  const isMobile = window.matchMedia("(max-width:760px)").matches;
  if (isMobile) {
    calSelectedDate = calAddDays(calSelectedDate, dir);
    if (calSelectedDate.getTime() < calWeekStart.getTime() || calSelectedDate.getTime() > calAddDays(calWeekStart, 6).getTime()) {
      calWeekStart = calWeekStartFor(calSelectedDate);
    }
  } else {
    calWeekStart = calAddDays(calWeekStart, dir * 7);
    calSelectedDate = calWeekStart;
  }
  calLoadAndRender();
};

async function calLoadAndRender(){
  const bodyEl = document.getElementById("calBody");
  if (!bodyEl) return;
  bodyEl.innerHTML = `<div class="loading">در حال بارگذاری…</div>`;
  const from = calDateStr(calWeekStart);
  const to = calDateStr(calAddDays(calWeekStart, 6));
  const [{ exceptions }, { days }, { bookings }] = await Promise.all([
    api(`/admin/day-exceptions?from=${from}&to=${to}`),
    api("/admin/working-days"),
    api(`/admin/bookings?from=${from}&to=${to}`),
  ]);
  if (bodyEl !== document.getElementById("calBody")) return; // در این فاصله از تب خارج شده
  window._calWorkingDays = days;
  window._calExceptions = exceptions;
  window._calBookings = bookings;
  calRenderRangeLabel();
  calRenderMobileStrip();
  const isMobile = window.matchMedia("(max-width:760px)").matches;
  bodyEl.innerHTML = isMobile ? calBuildDayView(calSelectedDate) : calBuildWeekView();
}

function calRenderRangeLabel(){
  const el = document.getElementById("calRangeLabel");
  if (!el) return;
  el.textContent = `${fmtJalaliDate(calWeekStart)} تا ${fmtJalaliDate(calAddDays(calWeekStart, 6))}`;

/* ---------- داده‌ها: وضعیت هر روز/هر تایم برای دسته‌بندی انتخاب‌شده ---------- */

function calCategory(){

// همون قانون getDayOpenInfo سمت سرور: یک DayException برای این تاریخ همیشه
// روی الگوی هفتگی WorkingDay اولویت داره
function calDayInfo(date){
  const dateStr = calDateStr(date);
  const exception = (window._calExceptions || []).find((e) => calDateStr(new Date(e.date)) === dateStr);
  if (exception) return { open: exception.isOpen, openTime: exception.openTime, closeTime: exception.closeTime, isException: true, exceptionId: exception.id };
  const dow = calDayOfWeek(date);
  const wd = (window._calWorkingDays || []).find((d) => d.dayOfWeek === dow);
  return { open: wd?.isOpen ?? false, openTime: null, closeTime: null, isException: false, exceptionId: null };
}
// همون قانون isTimeAllowed سمت سرور
function calTimeAllowed(time, info){
  if (info.openTime && time < info.openTime) return false;
  if (info.closeTime && time >= info.closeTime) return false;
  return true;
}
function calSlotsForDate(date){
  const cat = calCategory();
  if (!cat) return [];
  const dow = calDayOfWeek(date);
  return (cat.timeSlots || []).filter((s) => s.dayOfWeek === dow && s.isActive).sort((a, b) => a.time.localeCompare(b.time));
}
function calBookingsForDate(date){
  const cat = calCategory();
  if (!cat) return [];
  const dateStr = calDateStr(date);
  return (window._calBookings || []).filter((b) => b.categoryId === cat.id && calDateStr(new Date(b.date)) === dateStr);
}
function calOccupyingBooking(date, time){
  return calBookingsForDate(date).find((b) => b.time === time && !CAL_NOT_OCCUPYING.includes(b.status));
}
// گذشته یعنی ساعتش واقعاً شروع شده — بدون بازه‌ی ۳۰ دقیقه‌ای که سمت مشتری
// اعمال می‌شه؛ خود غزل باید بتونه یک مشتری حضوری رو همین چند دقیقه‌ی بعد ثبت کنه
function calIsPast(date, time){
  const today = calTodayUTC();
  if (date.getTime() < today.getTime()) return true;
  if (date.getTime() > today.getTime()) return false;
  const now = calNowInTehran();
  const nowHM = `${String(now.getUTCHours()).padStart(2, "0")}:${String(now.getUTCMinutes()).padStart(2, "0")}`;
  return time <= nowHM;
}
function calCellState(date, time){
  const info = calDayInfo(date);
  if (!info.open || !calTimeAllowed(time, info)) return { state: "closed" };
  const booking = calOccupyingBooking(date, time);
  if (booking) return { state: "booked", booking };
  if (calIsPast(date, time)) return { state: "past" };
  return { state: "empty" };
}

/* ---------- نمای هفتگی (دسکتاپ) ---------- */

function calWeekUnionTimes(){
  const times = new Set();
  for (let i = 0; i < 7; i++) calSlotsForDate(calAddDays(calWeekStart, i)).forEach((s) => times.add(s.time));
  return Array.from(times).sort();
}
function calBuildWeekView(){
  const times = calWeekUnionTimes();
  const days = Array.from({ length: 7 }, (_, i) => calAddDays(calWeekStart, i));
  if (!times.length) {
    return `<div class="card muted">برای «${esc(calCategory()?.name || "")}» هنوز اسلاتی تعریف نشده — از تب «زمان‌بندی سالن» اضافه کنید.</div>`;
  }
  const todayStr = calDateStr(calTodayUTC());
  let html = `<div class="cal-week-wrap"><table class="cal-grid"><thead><tr><th class="cal-timecol"></th>`;
  days.forEach((d) => {
    const info = calDayInfo(d);
    const dStr = calDateStr(d);
    html += `<th class="cal-daycol ${dStr === todayStr ? "is-today" : ""}">
      <div class="cal-daycol-inner">
        <button class="cal-kebab" title="کارهای این روز" aria-label="کارهای این روز" onclick="calOpenDayMenu('${dStr}')">⋮</button>
        <div class="cal-dname">${DOW_NAMES[calDayOfWeek(d)]}</div>
        <div class="cal-ddate">${fmtJalaliDate(d)}</div>
        <span class="tag ${info.open ? "tag-open" : "tag-closed"} cal-daytag">${info.open ? "باز" : "تعطیل"}</span>
      </div>
    </th>`;
  });
  html += `</tr></thead><tbody>`;
  times.forEach((t) => {
    html += `<tr><td class="cal-timecol">${t}</td>`;
    days.forEach((d) => {
      // a whole-day closure must win even when this weekday has zero
      // TimeSlot rows of its own (e.g. Saturday, never scheduled at all) —
      // otherwise a fully-closed day rendered as plain blank cells instead
      // of the "بسته" hatched style, since the hasSlot check below would
      // never even get a chance to run
      if (!calDayInfo(d).open) { html += `<td class="cal-cell cal-closed" title="بسته"></td>`; return; }
      const hasSlot = calSlotsForDate(d).some((s) => s.time === t);
      html += hasSlot ? calRenderCell(d, t) : `<td class="cal-cell cal-blank"></td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}
function calRenderCell(date, time){
  const cs = calCellState(date, time);
  const dateStr = calDateStr(date);
  if (cs.state === "closed") return `<td class="cal-cell cal-closed" title="بسته"></td>`;
  if (cs.state === "past") return `<td class="cal-cell cal-past" title="گذشته"></td>`;
  if (cs.state === "booked") {
    const b = cs.booking;
    const who = b.user ? esc(`${b.user.firstName} ${b.user.lastName}`) : esc(b.blockReason || "قفل دستی");
    const svc = b.service ? esc(b.service.name) : esc(b.blockReason || "بدون سرویس");
    return `<td class="cal-cell cal-booked" onclick="calOpenBooking('${b.id}')">
      <div class="cal-cell-title">${svc}</div><div class="cal-cell-sub">${who}</div>
    </td>`;
  }
  return `<td class="cal-cell cal-empty" onclick="calOpenEmptyMenu('${dateStr}','${time}')"></td>`;
}

/* ---------- نمای روزانه (موبایل) + نوار سوییچ ۷ روزه ---------- */

function calRenderMobileStrip(){
  const el = document.getElementById("calMobileStrip");
  if (!el) return;
  const days = Array.from({ length: 7 }, (_, i) => calAddDays(calWeekStart, i));
  const selStr = calDateStr(calSelectedDate);
  const todayStr = calDateStr(calTodayUTC());
  el.innerHTML = days
    .map((d) => {
      const dStr = calDateStr(d);
      const info = calDayInfo(d);
      return `<button class="cal-strip-day ${dStr === selStr ? "on" : ""} ${dStr === todayStr ? "is-today" : ""} ${!info.open ? "is-closed" : ""}"
        onclick="calSelectDay('${dStr}')">
        <span class="cal-strip-dname">${DOW_NAMES[calDayOfWeek(d)]}</span>
        <span class="cal-strip-dnum">${calJalaliDay(d)}</span>
      </button>`;
    })
    .join("");
}
window.calSelectDay = (dateStr) => {
  calSelectedDate = new Date(`${dateStr}T00:00:00Z`);
  calRenderMobileStrip();
  const bodyEl = document.getElementById("calBody");
  if (bodyEl) bodyEl.innerHTML = calBuildDayView(calSelectedDate);
};
function calBuildDayView(date){
  const info = calDayInfo(date);
  const dateStr = calDateStr(date);
  const slots = calSlotsForDate(date);
  const bookingsToday = calBookingsForDate(date);

  let html = `<div class="cal-day-header card">
    <div class="row" style="border:none;padding:0;">
      <div>
        <div style="font-size:16px;font-weight:900;color:#fff;">${DOW_NAMES[calDayOfWeek(date)]} — ${fmtJalaliDate(date)}</div>
        <span class="tag ${info.open ? "tag-open" : "tag-closed"}" style="margin-top:6px;display:inline-block;">${info.open ? "باز" : "تعطیل"}</span>
      </div>
      <div>
        ${info.isException
          ? `<button class="btn btn-ghost" onclick="calReopenDay('${dateStr}','${info.exceptionId}')">بازکردن مجدد</button>`
          : `<button class="btn btn-danger" onclick="calCloseWholeDay('${dateStr}')">تعطیل کردن کل این روز</button>`}
        ${info.open ? `<button class="btn btn-line" onclick="calOpenRangeForm('${dateStr}')">بستن/بازکردن یک بازه</button>` : ""}
      </div>
    </div>
  </div>`;

  html += calDaySummaryHtml(date, bookingsToday);

  if (!info.open) {
    // the «تعطیل» tag above already says everything — no slot list, and no
    // "no slots defined" message that would misattribute a closed day to a
    // missing schedule
  } else if (!slots.length) {
    html += `<div class="card muted">برای این روز/دسته‌بندی اسلاتی تعریف نشده.</div>`;
  } else {
    html += `<div class="cal-day-list">${slots.map((s) => calRenderDayRow(date, s.time)).join("")}</div>`;
  }
  return html;
}
function calRenderDayRow(date, time){
  const cs = calCellState(date, time);
  const dateStr = calDateStr(date);
  if (cs.state === "closed") return `<div class="cal-row cal-closed"><span class="cal-row-time">${time}</span><span class="cal-row-label">بسته</span></div>`;
  if (cs.state === "past") return `<div class="cal-row cal-past"><span class="cal-row-time">${time}</span><span class="cal-row-label">گذشته</span></div>`;
  if (cs.state === "booked") {
    const b = cs.booking;
    const who = b.user ? esc(`${b.user.firstName} ${b.user.lastName}`) : esc(b.blockReason || "قفل دستی");
    const svc = b.service ? esc(b.service.name) : esc(b.blockReason || "بدون سرویس");
    return `<div class="cal-row cal-booked" onclick="calOpenBooking('${b.id}')">
      <span class="cal-row-time">${time}</span>
      <div class="cal-row-main"><b>${svc}</b><div class="muted">${who}</div></div>
    </div>`;
  }
  return `<div class="cal-row cal-empty" onclick="calOpenEmptyMenu('${dateStr}','${time}')">
    <span class="cal-row-time">${time}</span><span class="cal-row-label">خالی — برای ثبت نوبت لمس کنید</span>
  </div>`;
}

/* ---------- خلاصه‌ی روزانه — همون تعریف/محاسبه‌ای که «داشبورد» از قبل
   برای نمای یک‌روزه‌اش داره (loadDashboardDay)، به‌علاوه‌ی یک عدد جدید:
   تعداد ساعت‌های خالیِ باقی‌مانده ---------- */
function calDaySummaryHtml(date, bookingsForDay){
  const totalReceived = bookingsForDay.filter((b) => b.payment && b.payment.status === "PAID").reduce((s, b) => s + b.depositAmount, 0);
  const breakdown = {};
  bookingsForDay.forEach((b) => { breakdown[b.status] = (breakdown[b.status] || 0) + 1; });
  const freeCount = calSlotsForDate(date).filter((s) => calCellState(date, s.time).state === "empty").length;

  return `<div class="card cal-summary">
    <div class="cal-summary-row">
      <div><span class="cal-summary-n">${pd(bookingsForDay.length)}</span><div class="muted" style="font-size:12px;">رزرو این روز</div></div>
      <div><span class="cal-summary-n" style="color:#7FD9A4;">${toman(totalReceived)}</span><div class="muted" style="font-size:12px;">بیعانه‌ی دریافتی</div></div>
      <div><span class="cal-summary-n">${pd(freeCount)}</span><div class="muted" style="font-size:12px;">ساعت خالی باقی‌مانده</div></div>
    </div>
    ${Object.keys(breakdown).length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">
      ${Object.entries(breakdown).map(([status, count]) => `<span class="tag ${BOOKING_STATUS_TAG_CLASS[status] || "tag-muted"}">${pd(count)} ${BOOKING_STATUS_FA[status] || status}</span>`).join("")}
    </div>` : ""}
  </div>`;
}

window.calSubmitCloseRange = withSubmitGuard(async (dateStr) => {
  const start = document.getElementById("calRangeStart").value;
  const end = document.getElementById("calRangeEnd").value;
  if (!start || !end) return toast("ساعت شروع و پایان را وارد کنید.", true);
  if (end <= start) return toast("ساعت پایان باید بعد از ساعت شروع باشد.", true);
  const categoryId = document.getElementById("calRangeScope").value || null;
  try {
    const r = await api("/admin/bookings/block-range", { method: "POST", body: JSON.stringify({ startDate: dateStr, endDate: dateStr, startTime: start, endTime: end, categoryId, reason: "بسته توسط مدیر" }) });

    calCloseModal();
    calLoadAndRender();
  } catch (e) { toast(e.message, true); }
});
window.calSubmitReopenRange = withSubmitGuard(async (dateStr) => {
  const start = document.getElementById("calRangeStart").value;
  const end = document.getElementById("calRangeEnd").value;
  if (!start || !end) return toast("ساعت شروع و پایان را وارد کنید.", true);
  if (end <= start) return toast("ساعت پایان باید بعد از ساعت شروع باشد.", true);

});

/* custom hours only make sense when the exception marks the day open — no
   point asking for a start/end time on a day being closed entirely. Also
   hidden entirely once a specific category is chosen — see
   renderExScopeVisibility below. */
function renderExHoursVisibility(){
  const row=document.getElementById("exHoursRow");
  const scope=document.getElementById("exScope")?.value;
  const isOpen=document.getElementById("exOpen")?.value!=="false";
  if(row) row.style.display=(!scope && isOpen)?"flex":"none";
}
window.renderExHoursVisibility = renderExHoursVisibility;

/* DayException (وضعیت باز/تعطیل + ساعات ویژه) is a whole-salon, day-level
   concept — WorkingDay/TimeSlot don't have a per-category "open" flag, so
   "open just one service on an otherwise-closed day" isn't a coherent
   action. Once a specific category is picked here, the form switches to
   the same close/reopen pair the bulk date-range tool uses (block-range),
   scoped to just this one day. */
function renderExScopeVisibility(){
  const scope=document.getElementById("exScope")?.value;
  const globalRow=document.getElementById("exGlobalRow");
  const scopedRow=document.getElementById("exScopedRow");
  if(globalRow) globalRow.style.display=scope?"none":"flex";
  if(scopedRow) scopedRow.style.display=scope?"flex":"none";
  renderExHoursVisibility();
}
window.renderExScopeVisibility = renderExScopeVisibility;

window.closeScopedDay = withSubmitGuard(async () => {
  const date=document.getElementById("exDate").value;
  const categoryId=document.getElementById("exScope").value;
  if(!date) return toast("تاریخ را انتخاب کنید.",true);
  if(!categoryId) return; // shouldn't be reachable — this row is hidden for "همه‌ی سرویس‌ها"
  const reason=document.getElementById("exScopedReason").value.trim()||null;
  if(!confirm(`${fmtJalaliDate(date)} فقط برای این سرویس بسته بشه؟`)) return;
  try{
    const r=await api("/admin/bookings/block-range",{method:"POST",body:JSON.stringify({startDate:date,endDate:date,categoryId,reason})});
    toast(`${r.blocked} تایم بسته شد.${r.skipped?` (${r.skipped} تایم از قبل رزرو/بسته بود و رد شد)`:""}`);
    tabs.schedule();
  }catch(e){ toast(e.message,true); }
});
window.reopenScopedDay = withSubmitGuard(async () => {
  const date=document.getElementById("exDate").value;
  const categoryId=document.getElementById("exScope").value;
  if(!date) return toast("تاریخ را انتخاب کنید.",true);
  if(!categoryId) return;
  try{
    const r=await api(`/admin/bookings/block-range?startDate=${date}&endDate=${date}&categoryId=${categoryId}`,{method:"DELETE"});
    toast(`${r.count} تایم باز شد.`);
    tabs.schedule();
  }catch(e){ toast(e.message,true); }
});

window.toggleDay = async (dayOfWeek, isOpen) => {
  // instant feedback — the hour inputs and open/closed tag update as soon as
  // the switch flips, without waiting for the PATCH round-trip
  const hours=document.getElementById(`dayHours-${dayOfWeek}`);
  const tag=document.getElementById(`dayTag-${dayOfWeek}`);
  if(hours) hours.style.display=isOpen?"flex":"none";
  if(tag){ tag.textContent=isOpen?"باز":"تعطیل"; tag.className=`tag ${isOpen?'tag-open':'tag-closed'}`; }
  try{ await api(`/admin/working-days/${dayOfWeek}`,{method:"PATCH",body:JSON.stringify({isOpen})}); toast("ذخیره شد."); }
  catch(e){ toast(e.message,true); }
};
window.updateDayHours = async (dayOfWeek, field, value) => {
  try{ await api(`/admin/working-days/${dayOfWeek}`,{method:"PATCH",body:JSON.stringify({[field]:value})}); toast("ذخیره شد."); }
  catch(e){ toast(e.message,true); }
};
window.addDayException = withSubmitGuard(async () => {
  const date=document.getElementById("exDate").value;
  if(!date) return toast("تاریخ را انتخاب کنید.",true);
  const isOpen=document.getElementById("exOpen").value==="true";
  const reason=document.getElementById("exReason").value.trim()||null;
  // only meaningful when the day is open — a closed day has no hours to set
  const openTime=isOpen?(document.getElementById("exOpenTime").value||null):null;
  const closeTime=isOpen?(document.getElementById("exCloseTime").value||null):null;
  try{
    const r=await api("/admin/day-exceptions",{method:"POST",body:JSON.stringify({date,isOpen,openTime,closeTime,reason})});
    toast(r.affectedBookings?`استثنا ثبت شد. توجه: ${r.affectedBookings} نوبت تأییدشده در این روز هست که خودکار لغو نشد.`:"استثنا ثبت شد.");
    tabs.schedule();
  }catch(e){ toast(e.message,true); }
});
window.deleteDayException = async (id) => {
  if(!confirm("این استثنا حذف شود؟")) return;
  try{ await api(`/admin/day-exceptions/${id}`,{method:"DELETE"}); toast("حذف شد."); tabs.schedule(); }
  catch(e){ toast(e.message,true); }
};
function closureRangeDayCount(startDate,endDate){
  return Math.round((new Date(endDate)-new Date(startDate))/86400000)+1;
}
window.addClosureRange = withSubmitGuard(async () => {
  const startDate=document.getElementById("closureStart").value;
  const endDate=document.getElementById("closureEnd").value;
  if(!startDate||!endDate) return toast("بازه‌ی تاریخ را کامل کنید.",true);
  const days=closureRangeDayCount(startDate,endDate);
  if(days<1) return toast("تاریخ پایان باید بعد از تاریخ شروع باشد.",true);
  const categoryId=document.getElementById("closureScope").value||null;
  const scopeLabel=categoryId? `فقط سرویس‌های «${document.getElementById("closureScope").selectedOptions[0].textContent.replace('فقط «','').replace('»','')}»` : "همه‌ی سرویس‌های سالن";
  if(!confirm(`${days} روز (از ${fmtJalaliDate(startDate)} تا ${fmtJalaliDate(endDate)}) برای ${scopeLabel} بسته بشه؟ هیچ مشتری‌ای نمی‌تونه توی این بازه آنلاین رزرو کنه.`)) return;
  const reason=document.getElementById("closureReason").value.trim()||null;
  try{

// اصلیه؛ برای این‌ها همون یک گزینه (خودشون) تنها گزینه‌ی داخل optgroup‌شونه.
function getSlotSelection(){

}

function onSlotSelectionChange(){
  const {categoryId}=getSlotSelection();
  const category=(window._scheduleCategories||[]).find(c=>c.id===categoryId);
  const isSharedLine=((category?.services||[]).filter(sv=>sv.active)).length>1;
  document.getElementById("slotSharedNote").style.display=isSharedLine?"block":"none";
  renderSlotDay();
}
window.onSlotSelectionChange = onSlotSelectionChange;

function renderSlotDay(){
  const {categoryId, serviceId}=getSlotSelection();
  const dow=Number(document.getElementById("slotDow").value);
  const category=(window._scheduleCategories||[]).find(c=>c.id===categoryId);
  const list=document.getElementById("slotDayList");
  if(!category){ list.innerHTML=""; return; }
  const selectedService=(category.services||[]).find(sv=>sv.id===serviceId);
  const daySlots=category.timeSlots.filter(s=>s.dayOfWeek===dow);

  // انتخاب یک سرویس مشخص: اسلات‌های اختصاصیِ همون سرویس + اسلات‌های
  // مشترکِ کل گروه (چون این‌ها هم قابل‌رزرو برای همین سرویس‌ان).
  // انتخاب «همه‌ی سرویس‌های این گروه»: فقط اسلات‌های مشترک، به‌علاوه‌ی هر
  // اسلاتی که مالکش یک سرویسِ غیرفعال‌شده باشه — تا گم نشه، نه اینکه قایم بشه.
  const visibleSlots=(serviceId
    ? daySlots.filter(s=>s.serviceId===serviceId || !s.serviceId)
    : daySlots.filter(s=>{
        if(!s.serviceId) return true;
        const owner=(category.services||[]).find(sv=>sv.id===s.serviceId);
        return owner && !owner.active;
      })
  ).slice().sort((a,b)=>a.time.localeCompare(b.time));

  if(!visibleSlots.length){ list.innerHTML='<p class="muted">هنوز اسلاتی برای این روز/انتخاب ثبت نشده.</p>'; return; }
  list.innerHTML = `<div class="slot-grid">` + visibleSlots.map(s=>{
    let ownerControl="";
    if(serviceId){
      // این نما فقط دو حالت ممکن داره: مشترک، یا اختصاصیِ همین سرویس
      const isShared=!s.serviceId;
      ownerControl=`<select class="slot-owner" onchange="reassignSlotOwner('${s.id}', this.value)">
        <option value="" ${isShared?"selected":""}>مشترک بین گروه</option>
        <option value="${serviceId}" ${!isShared?"selected":""}>فقط «${esc(selectedService?.name||"")}»</option>
      </select>`;
    }else{
      const owner=(category.services||[]).find(sv=>sv.id===s.serviceId);
      if(owner){
        ownerControl=`<button class="btn btn-ghost btn-sm" style="padding:4px 8px;font-size:10.5px;" title="این اسلات هنوز به «${esc(owner.name)}» (غیرفعال) تعلق دارد" onclick="reassignSlotOwner('${s.id}', '')">مشترک کردن</button>`;
      }
    }
    return `
    <div class="slot-cell ${s.isActive?'':'off'}">
      <span class="t">${s.time}</span>
      ${ownerControl}
      <div class="actions">
        <button title="${s.isActive?'غیرفعال کردن':'فعال کردن'}" aria-label="${s.isActive?'غیرفعال کردن':'فعال کردن'}" onclick="toggleSlot('${s.id}', ${!s.isActive})">${s.isActive?'⏸':'▶'}</button>
        <button class="del" title="حذف" aria-label="حذف این اسلات" onclick="deleteSlot('${s.id}')">✕</button>
      </div>
    </div>`;
  }).join("") + `</div>`;
}

/* batches the same PATCH toggleSlot() already does for one slot, across
   every slot in [start,end) for the day-of-week selected above and
   whichever category(ies) "rangeCat" picks — empty value means every
   category, e.g. for a salon-wide lunch break. Same "reopen" button just
   runs it again with isActive:true, so nothing needs to be remembered
   between closing and reopening a range. */
window.closeSlotRange = withSubmitGuard(async (enable) => {
  const start=document.getElementById("rangeStart").value;
  const end=document.getElementById("rangeEnd").value;
  if(!start||!end) return toast("ساعت شروع و پایان بازه را وارد کنید.",true);
  if(end<=start) return toast("ساعت پایان باید بعد از ساعت شروع باشد.",true);
  const catId=document.getElementById("rangeCat").value;
  const dow=Number(document.getElementById("slotDow").value);
  const scopeCategories=catId
    ? (window._scheduleCategories||[]).filter(c=>c.id===catId)
    : (window._scheduleCategories||[]);
  const slots=scopeCategories.flatMap(c=>(c.timeSlots||[]).filter(s=>s.dayOfWeek===dow && s.time>=start && s.time<end));
  if(!slots.length) return toast("اسلاتی در این بازه برای این روز/دسته یافت نشد.",true);
  if(!enable && !confirm(`${slots.length} اسلات (از ${start} تا ${end}) غیرفعال بشه؟`)) return;
  try{
    await Promise.all(slots.map(s=>api(`/admin/time-slots/${s.id}`,{method:"PATCH",body:JSON.stringify({isActive:enable})})));
    toast(enable?`${slots.length} اسلات باز شد.`:`${slots.length} اسلات بسته شد.`);
    await refreshScheduleSlots();
  }catch(e){ toast(e.message,true); }
});

/* =====================================================================
   رزروها: لیست + رزرو دستی/قفل تایم + تغییر وضعیت
   ===================================================================== */
const BOOKING_STATUS_FA = {PENDING_PAYMENT:"در انتظار پرداخت",CONFIRMED:"تاییدشده",CANCELLED:"لغوشده",EXPIRED:"منقضی",COMPLETED:"انجام‌شده",NO_SHOW:"مشتری نیامد"};
const BOOKING_STATUS_TAG_CLASS = {PENDING_PAYMENT:"tag-pending",CONFIRMED:"tag-open",CANCELLED:"tag-closed",EXPIRED:"tag-muted",COMPLETED:"tag-open",NO_SHOW:"tag-closed"};
// only meaningful for a CANCELLED booking that actually had a paid deposit —
// see backend services/bookingCancellation.ts for how each is decided
const REFUND_STATUS_FA = {SUCCEEDED:"بازگشت وجه موفق",NEEDS_MANUAL_FOLLOWUP:"نیاز به پیگیری دستی",NOT_APPLICABLE:"بدون بازگشت (لغو دیرهنگام)"};
const REFUND_STATUS_TAG_CLASS = {SUCCEEDED:"tag-open",NEEDS_MANUAL_FOLLOWUP:"tag-pending",NOT_APPLICABLE:"tag-muted"};

// the filter is a superset of BookingStatus: CANCELLED is split into its
// three refund outcomes so "نیاز به پیگیری دستی" can be isolated at a glance
// instead of getting lost among every other cancelled booking
function bookingFilterKey(b){
  if(b.status!=="CANCELLED") return b.status;
  if(!b.payment || b.payment.status!=="PAID") return "CANCELLED_NO_PAYMENT";
  return `CANCELLED_${b.payment.refundStatus}`;
}

function renderBookingsList(bookings, filter){
  const filtered = filter==="ALL" ? bookings : bookings.filter(b=>bookingFilterKey(b)===filter);
  if(!filtered.length) return `<div class="card muted">نوبتی با این فیلتر پیدا نشد.</div>`;
  return `<div class="card">` + filtered.map(b=>{
    const who = b.user ? esc(`${b.user.firstName} ${b.user.lastName} (${b.user.phone})`) : "بدون مشتری (قفل دستی)";
    const svc = b.service ? b.service.name : (b.blockReason || "بدون سرویس");
    const showRefund = b.status==="CANCELLED" && b.payment && b.payment.status==="PAID";
    return `<div class="row" style="flex-wrap:wrap;">
      <div>
        <b>${esc(svc)}</b> ${b.source!=="ONLINE"?`<span class="tag tag-muted">${b.source==='ADMIN_BLOCK'?'قفل دستی':'ثبت دستی'}</span>`:''}
        <div class="muted">${who}</div>
        <div class="muted">${fmtJalaliDate(b.date)} ساعت ${b.time} — بیعانه ${toman(b.depositAmount)}</div>
        ${showRefund && b.payment.refundStatus==="NEEDS_MANUAL_FOLLOWUP"?`<div class="muted" style="margin-top:4px;">${esc(b.payment.refundNote||"بازگشت خودکار وجه فعال نیست؛ باید مبلغ بیعانه را خودتان (مثلاً کارت‌به‌کارت) به مشتری برگردانید.")}</div>`:''}
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span class="tag ${BOOKING_STATUS_TAG_CLASS[b.status]||'tag-muted'}">${BOOKING_STATUS_FA[b.status]||b.status}</span>
        ${showRefund?`<span class="tag ${REFUND_STATUS_TAG_CLASS[b.payment.refundStatus]||'tag-muted'}">${REFUND_STATUS_FA[b.payment.refundStatus]||b.payment.refundStatus}</span>`:''}
        ${showRefund && b.payment.refundStatus==="NEEDS_MANUAL_FOLLOWUP"?`<button class="btn btn-ghost btn-sm" onclick="resolveRefund('${b.payment.id}')">علامت‌گذاری به‌عنوان بازگشت داده‌شده</button>`:''}
        ${b.status==="CONFIRMED"?`
          <select onchange="setBookingStatus('${b.id}', this.value)" title="«مشتری نیامد» فقط ثبت داخلی است — نه پیامکی می‌ره و نه بیعانه خودکار برمی‌گرده.">
            <option value="">تغییر وضعیت…</option>
            <option value="COMPLETED">انجام‌شده (پیامک تشکر/نظرسنجی ارسال می‌شود)</option>
            <option value="NO_SHOW">مشتری نیامد</option>
            <option value="CANCELLED">لغو</option>
          </select>`:b.status==="PENDING_PAYMENT"?`
          <select onchange="setBookingStatus('${b.id}', this.value)">
            <option value="">تغییر وضعیت…</option>
            <option value="CANCELLED">لغو</option>
          </select>`:''}
      </div>
    </div>`;
  }).join("") + `</div>`;
}

window.moveGalleryImage = async (id, direction) => {
  const images = (window._galleryImages||[]).slice();
  const idx = images.findIndex(i=>i.id===id);
  const swapWith = direction==="up" ? idx-1 : idx+1;
  if(idx<0 || swapWith<0 || swapWith>=images.length) return;
  [images[idx], images[swapWith]] = [images[swapWith], images[idx]];
  try{
    // renumbers the whole list sequentially rather than swapping raw
    // sortOrder values — every image currently uploads with sortOrder 0
    // (nothing has set it before now), so a plain value-swap between two
    // tied items would do nothing; a full renumber is correct either way
    await Promise.all(images.map((img,i)=>api(`/admin/gallery/${img.id}`,{method:"PATCH",body:JSON.stringify({sortOrder:i})})));
    toast("ترتیب ذخیره شد.");
    tabs.gallery();
  }catch(e){ toast(e.message,true); }
};
window.uploadImage = async (input) => {
  const files = Array.from(input.files || []);
  if(!files.length) return;
  if(input.disabled) return; // already uploading — the change event can't normally re-fire mid-upload, but guard anyway
  input.disabled = true;
  // uploaded one at a time (not Promise.all) — a salon owner selecting a
  // few dozen photos at once shouldn't fire that many concurrent requests
  // against the image-optimization step, and a running "x از y" count is
  // more useful feedback than everything landing at once anyway
  let uploaded = 0;
  const failures = [];
  for(const file of files){
    try{
      const fd = new FormData(); fd.append("file", file);
      const data = await api("/admin/upload", { method:"POST", body: fd });
      await api("/admin/gallery",{method:"POST",body:JSON.stringify({url:data.url,category:"haircut"})});
      uploaded++;
      if(files.length>1) toast(`در حال آپلود… (${uploaded} از ${files.length})`);
    }catch(e){ failures.push(`${file.name}: ${e.message}`); }
  }
  if(failures.length) toast(`${uploaded} عکس اضافه شد — ${failures.length} مورد ناموفق: ${failures.join(" | ")}`, uploaded===0);
  else toast(files.length>1 ? `${uploaded} عکس اضافه شد.` : "عکس اضافه شد.");
  tabs.gallery(); // re-renders the tab, which recreates (and re-enables) this input
};
window.updateGalleryField = async (id, field, value) => {
  try{ await api(`/admin/gallery/${id}`,{method:"PATCH",body:JSON.stringify({[field]:value})}); toast("ذخیره شد."); }

// خودِ key فقط یک شناسه‌ی داخلیه که هیچ‌جا به غزل نشون داده نمی‌شه — از روی
// نام + یک مقدار تصادفی ساخته می‌شه تا مجبور نباشه چیز فنی وارد کنه
function slugifyCategoryKey(name){
  const base=name.trim().toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9آ-ی_]/g,"").slice(0,40);
  return `cat_${base||"group"}_${Date.now().toString(36)}`;
}
async function promptCreateCategory(){
  const name=prompt("نام گروه جدید چیه؟ (اگه می‌خوای این سرویس کاملاً مستقل باشه، می‌تونی اسم خودِ سرویس رو بذاری)");
  if(!name||!name.trim()) return null;
  try{
    const {category}=await api("/admin/categories",{method:"POST",body:JSON.stringify({key:slugifyCategoryKey(name),name:name.trim()})});
    toast("گروه جدید ساخته شد.");
    return category;
  }catch(e){ toast(e.message,true); return null; }
}
window.handleNewGroupOption = async (selectEl) => {
  if(selectEl.value!=="__new__") return;
  const category=await promptCreateCategory();
  const fallback=[...selectEl.options].find(o=>o.value!=="__new__");
  if(!category){ if(fallback) selectEl.value=fallback.value; return; }
  const opt=document.createElement("option");
  opt.value=category.id; opt.textContent=category.name;
  selectEl.insertBefore(opt, selectEl.querySelector('option[value="__new__"]'));
  selectEl.value=category.id;
};
window.changeServiceCategory = async (id, selectEl) => {
  let categoryId=selectEl.value;
  if(categoryId==="__new__"){
    const category=await promptCreateCategory();
    if(!category){ tabs.services(); return; }
    categoryId=category.id;
  }
  try{
    const r=await api(`/admin/services/${id}`,{method:"PATCH",body:JSON.stringify({categoryId})});
    toast(r.reassignedSlotCount
      ? `گروه سرویس تغییر کرد. توجه: ${r.reassignedSlotCount} اسلات اختصاصیِ این سرویس در گروه قبلی، حالا «مشترک» بین بقیه‌ی گروه شد.`
      : "گروه سرویس تغییر کرد.");
    tabs.services();
  }catch(e){ toast(e.message,true); tabs.services(); }
};
window.createService = withSubmitGuard(async () => {
  const key=document.getElementById("nsKey").value.trim();
  const name=document.getElementById("nsName").value.trim();
  const categoryId=document.getElementById("nsCat").value;
  const durationMin=Number(document.getElementById("nsDuration").value)||null;

window.showCustomerHistory = async (id) => {
  try{
    const {customer} = await api(`/admin/customers/${id}`);
    const statusFa = {PENDING_PAYMENT:"در انتظار پرداخت",CONFIRMED:"تاییدشده",CANCELLED:"لغوشده",EXPIRED:"منقضی",COMPLETED:"انجام‌شده",NO_SHOW:"مشتری نیامد"};
    const statusTagClass = {PENDING_PAYMENT:"tag-pending",CONFIRMED:"tag-open",CANCELLED:"tag-closed",EXPIRED:"tag-muted",COMPLETED:"tag-open",NO_SHOW:"tag-closed"};
    const bookings = customer.bookings;

    // برای شناسایی مشتری‌های وفادار و مشتری‌هایی که مکرر لغو می‌کنن/نمیان —
    // همه‌چیز از همون لیست کامل نوبت‌ها که سرور برمی‌گردونه محاسبه می‌شه
    const completed = bookings.filter(b=>b.status==="COMPLETED");
    const cancelled = bookings.filter(b=>b.status==="CANCELLED");
    const noShows = bookings.filter(b=>b.status==="NO_SHOW");
    const totalPaid = bookings.reduce((sum,b)=>sum+(b.payment&&b.payment.status==="PAID"?b.payment.amount:0),0);
    const lastVisit = completed.length ? completed.reduce((a,b)=>new Date(a.date)>new Date(b.date)?a:b) : null;

    let html = `<div class="card"><h3>تاریخچه‌ی ${esc(`${customer.firstName} ${customer.lastName}`)}</h3>
      <div class="stat-grid" style="margin-top:14px;">
        <div class="stat-tile"><span class="n">${pd(String(completed.length))}</span><div class="l">نوبت انجام‌شده</div></div>
        <div class="stat-tile"><span class="n" style="font-size:18px;">${toman(totalPaid)}</span><div class="l">مجموع بیعانه‌ی پرداختی</div></div>
        <div class="stat-tile"><span class="n" style="font-size:16px;">${lastVisit?fmtJalaliDate(lastVisit.date):"—"}</span><div class="l">آخرین مراجعه</div></div>
        <div class="stat-tile"><span class="n">${pd(String(cancelled.length))}</span><div class="l">تعداد لغو</div></div>
        <div class="stat-tile"><span class="n">${pd(String(noShows.length))}</span><div class="l">عدم حضور (No-show)</div></div>
      </div>`;

    if(cancelled.length){
      html += `<div class="muted" style="margin-top:14px;">تاریخ لغوها: ${cancelled.map(b=>fmtJalaliDate(b.cancelledAt||b.date)).join("، ")}</div>`;
    }

    html += `<div class="section-title" style="margin-top:18px;">لیست کامل نوبت‌ها</div>`;
    if(!bookings.length) html += `<p class="muted">نوبتی ثبت نشده.</p>`;
    bookings.forEach(b=>{
      html += `<div class="row"><div>${b.service?esc(b.service.name):"—"} — ${fmtJalaliDate(b.date)} ساعت ${b.time}</div><span class="tag ${statusTagClass[b.status]||'tag-muted'}">${statusFa[b.status]||b.status}</span></div>`;
    });
    html += `</div>`;
    document.getElementById("customerHistory").innerHTML = html;
  }catch(e){ toast(e.message,true); }
};

// هر سه، لینک/deep-link رسمی خودِ همون اپ‌ان — روی موبایل اگر اپ نصب باشد
// مستقیم در اپ باز می‌شود، وگرنه به نسخه‌ی وب همون سرویس سقوط می‌کند. سایت
// عمومی همین سه لینک را زیر «مسیریابی» در فوتر نشان می‌دهد.
function directionLinks(lat, lng){
  const ll = `${lat},${lng}`;
  return {
    "نشان": `https://nshn.ir/?lat=${lat}&lng=${lng}`,
    "گوگل‌مپ": `https://www.google.com/maps/search/?api=1&query=${ll}`,
    "ویز": `https://www.waze.com/ul?ll=${ll}&navigate=yes`,
  };
}
function renderMapPreview(lat, lng){
  const el = document.getElementById("ciMapPreview");
  if(!el) return;
  if(lat==null || lng==null){
    el.innerHTML = `<p class="muted">هر دو مقدار را وارد کنید تا دکمه‌های مسیریابی روی سایت فعال شوند.</p>`;
    return;
  }
  el.innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;">` +
    Object.entries(directionLinks(lat,lng)).map(([label,href])=>
      `<a class="btn btn-line btn-sm" target="_blank" rel="noopener" href="${href}">پیش‌نمایش ${label} ↗</a>`
    ).join("") + `</div>`;
}
