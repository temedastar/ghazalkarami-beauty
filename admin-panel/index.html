  if(value !== null && !Number.isFinite(value)){ toast("مقدار عددی معتبر وارد کنید.",true); return; }
  try{
    await api("/admin/contact-info",{method:"PATCH",body:JSON.stringify({[field]:value})});
    toast("ذخیره شد.");
    const lat = document.getElementById("ciLat").value.trim();
    const lng = document.getElementById("ciLng").value.trim();
    renderMapPreview(lat===""?null:Number(lat), lng===""?null:Number(lng));
  }catch(e){ toast(e.message,true); }
};

  catch(e){ toast(e.message,true); }
};

/* =====================================================================
   پیامک‌ها
   ===================================================================== */
const SMS_TYPE_FA = {OTP:"کد ورود",BOOKING_CONFIRM:"تایید رزرو",REMINDER:"یادآوری نوبت",THANK_YOU_REVIEW:"تشکر + درخواست نظر"};
tabs.smsLogs = async () => {
  const {logs} = await api("/admin/sms-logs?limit=200");
  let html = `<h1>پیامک‌ها</h1><div class="card"><div class="mobile-scroll-hint">برای دیدن همه‌ی ستون‌ها، جدول را به چپ بکشید ←</div><div class="table-wrap"><table class="simple"><thead><tr><th>موبایل</th><th>نوع</th><th>وضعیت</th><th>خطا</th><th>زمان</th></tr></thead><tbody>`;
  if(!logs.length) html += `<tr><td colspan="5" class="muted">هنوز پیامکی ارسال نشده.</td></tr>`;
  logs.forEach(l=>{
    const tag = l.status==="SUCCESS"?"tag-open":l.status==="FAILED"?"tag-closed":"tag-muted";
    const statusFa = l.status==="SUCCESS"?"موفق":l.status==="FAILED"?"ناموفق":"حالت آزمایشی (بدون ارسال واقعی)";
    // full text in the title attribute (hover) since Kavenegar error bodies
    // can run long — the cell itself stays truncated so the table doesn't stretch
    const errCell = l.errorMessage
      ? `<span title="${esc(l.errorMessage)}" style="color:var(--danger);font-size:12.5px;">${esc(l.errorMessage.length>70?l.errorMessage.slice(0,70)+'…':l.errorMessage)}</span>`
      : `<span class="muted">—</span>`;
    html += `<tr><td>${l.phone}</td><td>${SMS_TYPE_FA[l.type]||l.type}</td><td><span class="tag ${tag}">${statusFa}</span></td><td>${errCell}</td><td>${fmtJalaliDate(l.createdAt)}، ${new Date(l.createdAt).toLocaleTimeString("fa-IR")}</td></tr>`;
  });
  html += `</tbody></table></div></div>`;
  setMainContent(html);
};

   تنظیمات کلی

    <div class="form-grid">
      <label class="field">یادآوری چند ساعت قبل از نوبت ارسال شود؟<input type="number" value="${settings.reminderHoursBefore}" onchange="updateSettings('reminderHoursBefore',Number(this.value))" style="width:100px;"></label>
    </div>
    <div class="form-grid" style="margin-top:16px;">
      <label class="field">نوع بیعانه‌ی پیش‌فرض (وقتی سرویسی مقدار خاص خودش را ندارد)<select onchange="updateSettings('defaultDepositType',this.value)">
        <option value="FIXED" ${settings.defaultDepositType==='FIXED'?'selected':''}>مبلغ ثابت</option>
        <option value="PERCENT" ${settings.defaultDepositType==='PERCENT'?'selected':''}>درصدی</option>
      </select></label>
      <label class="field">مقدار پیش‌فرض<input type="number" value="${settings.defaultDepositValue}" onchange="updateSettings('defaultDepositValue',Number(this.value))" style="width:120px;"></label>
    </div>
  </div>`;

  html += `<div class="section-title">شماره موبایل شما (برای اطلاع لغو نوبت)</div><div class="card">
    <p class="muted" style="margin-bottom:14px;">هر بار مشتری نوبتی رو خودش لغو کنه، یک پیامک کوتاه به این شماره ارسال می‌شه تا خبردار بشید و بخش «بازگشت وجه در انتظار» رو چک کنید.</p>
    <div class="form-grid">
      <label class="field">موبایل<input type="tel" class="wide" value="${esc(settings.ownerNotifyPhone||'')}" placeholder="09xxxxxxxxx" onchange="updateSettings('ownerNotifyPhone',this.value||null)"></label>
    </div>
  </div>`;

  html += `<div class="section-title">تغییر رمز عبور</div><div class="card">
    <div class="form-grid">
      <label class="field">رمز عبور جدید<input type="password" id="newPassword" autocomplete="new-password"></label>
      <label class="field">تکرار رمز عبور جدید<input type="password" id="newPasswordConfirm" autocomplete="new-password"></label>
      <button class="btn btn-gold btn-sm" onclick="changeAdminPassword()">ثبت رمز جدید</button>
    </div>
    <p class="muted" style="margin-top:10px;">رمز عبور باید حداقل ۸ کاراکتر و شامل حروف و عدد باشد.</p>
  </div>`;

  html += `<div class="section-title">تست اتصال به فضای ذخیره‌سازی ابری (Object Storage)</div><div class="card">
    <p class="muted" style="margin-bottom:16px;">اگر آپلود عکس تو تب «گالری» با خطا مواجه می‌شه، اول این تست رو بزن — دقیقاً می‌گه مشکل کجاست (تنظیمات، اتصال، یا خودِ آپلود).</p>
    <button class="btn btn-gold btn-sm" onclick="testObjectStorage()">تست اتصال</button>
    <div id="storageTestResult" style="margin-top:16px;"></div>
  </div>`;

  setMainContent(html);
};
window.changeAdminPassword = withSubmitGuard(async () => {
  const password=document.getElementById("newPassword").value;
  const confirmPassword=document.getElementById("newPasswordConfirm").value;
  if(!password||!confirmPassword) return toast("هر دو فیلد را پر کنید.",true);
  if(password!==confirmPassword) return toast("رمز عبور و تکرار آن یکسان نیستند.",true);
  try{
    await api("/auth/set-password",{method:"POST",body:JSON.stringify({password})});
    toast("رمز عبور با موفقیت تغییر کرد.");
    document.getElementById("newPassword").value="";
    document.getElementById("newPasswordConfirm").value="";
  }catch(e){ toast(e.message,true); }
});
window.updateSettings = async (field, value) => {
  try{ await api("/admin/settings",{method:"PATCH",body:JSON.stringify({[field]:value})}); toast("ذخیره شد."); }
  catch(e){ toast(e.message,true); }
};
const STORAGE_STAGE_FA = {config:"تنظیمات (متغیرهای محیطی)", connect:"اتصال به باکت", upload:"آپلود فایل آزمایشی"};
window.testObjectStorage = withSubmitGuard(async () => {
  const el = document.getElementById("storageTestResult");
  el.innerHTML = `<p class="muted">در حال تست…</p>`;
  let r;
  try{
    r = await api("/admin/object-storage/test");
  }catch(e){
    el.innerHTML = `<div class="card muted" style="border-color:var(--danger);">درخواست تست خودش ناموفق بود: ${esc(e.message)}</div>`;
    return;
  }
  const cfgRows = [
    ["آدرس (Endpoint)", r.config.endpoint, r.config.endpointConfigured],
    ["نام باکت (Bucket)", r.config.bucket, r.config.bucketConfigured],
    ["منطقه (Region)", r.config.region, true],
    ["کلید دسترسی (Access Key)", r.config.accessKeyConfigured?"تنظیم شده":"—", r.config.accessKeyConfigured],
    ["کلید محرمانه (Secret Key)", r.config.secretKeyConfigured?"تنظیم شده":"—", r.config.secretKeyConfigured],
  ];
  let html = `<div class="card" style="border-color:${r.ok?'var(--success)':'var(--danger)'};">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <span class="tag ${r.ok?'tag-open':'tag-closed'}" style="font-size:13px;">${r.ok?'✓ موفق':'✗ ناموفق — مرحله: '+(STORAGE_STAGE_FA[r.stage]||r.stage)}</span>
    </div>
    <div class="mobile-scroll-hint">برای دیدن مقدار هر ردیف، جدول را به چپ بکشید ←</div>
    <div class="table-wrap"><table class="simple" style="margin-bottom:${r.ok?'0':'14px'};"><tbody>
      ${cfgRows.map(([label,val,ok])=>`<tr><td class="muted">${label}</td><td>${val?esc(String(val)):'<span style="color:var(--danger);">— تنظیم نشده</span>'}</td></tr>`).join("")}
    </tbody></table></div>`;
  if(r.publicAccess){
    // upload itself worked — this stage checks something the upload call
    // itself can't: whether an anonymous browser (not our signed admin
    // request) can actually load the file at its public URL. That depends
    // only on the bucket's public/private access level in Liara's console.
    html += `<p class="muted" style="margin-bottom:10px;">لینک عمومی فایل آزمایشی: <a href="${esc(r.publicUrl)}" target="_blank" rel="noopener" style="color:var(--must-l);word-break:break-all;">${esc(r.publicUrl)}</a></p>`;
    if(r.publicAccess.reachable){
      html += `<p style="color:#7FD9A4;">فایل آزمایشی از همین لینک، بدون نیاز به ورود، با موفقیت بارگذاری شد — یعنی باکت درست روی «عمومی» تنظیم شده و عکس‌ها باید در سایت نمایش داده بشن.</p>`;
    } else {
      html += `<p style="color:var(--danger);margin-bottom:10px;">فایل با موفقیت آپلود شد، ولی همین لینک عمومی از بیرون (بدون ورود) قابل بارگذاری نبود${r.publicAccess.httpStatus?` (کد HTTP ${r.publicAccess.httpStatus})`:''}${r.publicAccess.error?` — ${esc(r.publicAccess.error)}`:''}. این دقیقاً همون علتیه که عکس‌ها تو سایت نمایش داده نمی‌شن.</p>
      <p style="color:var(--danger);">راه‌حل: وارد کنسول لیارا بشید → فضای ذخیره‌سازی ابری → روی باکت‌تون بزنید → تنظیمات → سطح دسترسی (Access Level) رو از «خصوصی» به «عمومی» تغییر بدید.</p>`;
    }
  } else if(!r.ok){
    const err = r.error;
    if(typeof err === "string"){
      html += `<p style="color:var(--danger);">${esc(err)}</p>`;
    } else {
      html += `<div class="table-wrap"><table class="simple"><tbody>
        ${err.code?`<tr><td class="muted">کد خطا</td><td>${esc(err.code)}</td></tr>`:''}
        ${err.name?`<tr><td class="muted">نوع خطا</td><td>${esc(err.name)}</td></tr>`:''}
        ${err.message?`<tr><td class="muted">پیام</td><td>${esc(err.message)}</td></tr>`:''}
        ${err.httpStatusCode?`<tr><td class="muted">کد HTTP</td><td>${esc(String(err.httpStatusCode))}</td></tr>`:''}
        ${err.causeMessage?`<tr><td class="muted">علت زیرین (شبکه/DNS)</td><td>${esc(err.causeMessage)}</td></tr>`:''}
        ${err.requestId?`<tr><td class="muted">شناسه‌ی درخواست</td><td>${esc(err.requestId)}</td></tr>`:''}
      </tbody></table></div>`;
    }
  } else {
    html += `<p style="color:#7FD9A4;">آپلود و حذف فایل آزمایشی با موفقیت انجام شد — فضای ذخیره‌سازی سالمه.</p>`;
  }
  html += `</div>`;
  el.innerHTML = html;
});

document.querySelectorAll(".sidebar button[data-tab]").forEach(btn=>{
  btn.addEventListener("click", () => {
    document.querySelectorAll(".sidebar button[data-tab]").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    document.getElementById("mainContent").innerHTML = `<div class="loading">در حال بارگذاری…</div>`;
    tabs[btn.dataset.tab]().catch(e=>toast(e.message,true));
  });
});

async function boot(){
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").classList.add("on");
  document.getElementById("mainContent").innerHTML = `<div class="loading">در حال بارگذاری…</div>`;
  try{ await tabs.dashboard(); }catch(e){ toast(e.message,true); }
}

if(TOKEN) boot();
